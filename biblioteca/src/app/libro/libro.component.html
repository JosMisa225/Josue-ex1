<main>
    <h1>Registro de libros</h1>
    <button type="button" (click)="cerrarSesion()">Iniciar Sesion</button>
    <p>Total: {{libros.length}}</p>

    <label for="titulo">Titulo</label>
    <input id="titulo" name="titulo" [(ngModel)]="titulo" required>
    <label for="autor">Autor</label>
    <input id="autor" name="autor" [(ngModel)]="autor" required>
    <button type="button" (click)="guardar()">Guardar</button>
     <button type="button" (click)="limpiar()">Limpiar</button>

    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titulo</th>
                    <th>Autor</th>
                </tr>
            </thead>
            <tbody>
                @for(libro of libros; track libro.id){
                    <tr>
                        <td>{{libro.id}}</td>
                        <td>{{libro.titulo}}</td>
                        <td>{{libro.autor}}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</main>
