<main>
    <h1>Iniciar Sesion</h1>
    @if (!sesionIn){
        <form (submit)="iniciarSesion()">
            <label for="user">Usuario</label>
            <input id="user" name="user" [(ngModel)]="usuario" required>
            <label for="pass">Clave</label>
            <input id="pass" name="pass" [(ngModel)]="clave" type="password" required>
            <button type="submit">Iniciar Sesion</button>
        </form>
    } @else {
        <p>Bienvenido</p>
        <button type="button" (click)="cerrarsesion()">Cerrar Sesion</button>
    }
</main>
